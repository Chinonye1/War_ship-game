<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>War Ship</title>
    <!-- Google Fonts for Typography styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
    <!-- Start Game Modal -->
    <div id="difficulty-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Warship Battle</h2>
            <p id="diff-desc">Defeat enemies and progress through the increasingly difficult levels.</p>
            <div class="difficulty-buttons">
                <button id="btn-start" class="diff-btn" onclick="startGame('easy')">Start Game</button>
            </div>
        </div>
    </div>

    <!-- Next Level Modal -->
    <div id="next-level-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Level Complete!</h2>
            <p id="next-level-desc">Get ready for the next challenge.</p>
            <div class="difficulty-buttons">
                <button id="btn-next-level" class="diff-btn">Continue</button>
            </div>
        </div>
    </div>

    <div id="seaboard">
        <div id="player-warship"></div>
        <div id="opponents-warship"></div>
        <div id="bullets"></div>
        
        <!-- Mobile Controls -->
        <div id="mobile-controls">
            <div id="dpad">
                <button id="up-btn" class="control-btn dir-btn">&#8593;</button>
                <div class="dpad-middle">
                    <button id="left-btn" class="control-btn dir-btn">&#8592;</button>
                    <button id="right-btn" class="control-btn dir-btn">&#8594;</button>
                </div>
                <button id="down-btn" class="control-btn dir-btn">&#8595;</button>
            </div>
            <div id="action-buttons">
                <button id="shoot-btn" class="control-btn action-btn">FIRE</button>
            </div>
        </div>
    </div>
    
    <script src="./src/index.js"></script>
</body>
</html>
